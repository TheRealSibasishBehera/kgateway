apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-gateway
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-with-disable
  namespace: default
spec:
  parentRefs:
    - name: test-gateway
  hostnames:
    - "disabled.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /disabled
      backendRefs:
        - name: backend
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-without-override
  namespace: default
spec:
  parentRefs:
    - name: test-gateway
  hostnames:
    - "enabled.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /enabled
      backendRefs:
        - name: backend
          port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: server
          image: gcr.io/k8s-staging-gateway-api/echo-basic:latest
          ports:
            - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-proc-grpc
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ext-proc-grpc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ext-proc-grpc
    spec:
      containers:
        - name: grpc-extproc
          image: sibseh/basic-sink:fix-2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18080
              name: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: ext-proc-grpc
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: ext-proc-grpc
  ports:
    - port: 4444
      targetPort: 18080
      protocol: TCP
      appProtocol: kubernetes.io/h2c
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: ext-proc-extension
  namespace: default
spec:
  type: ExtProc
  extProc:
    grpcService:
      backendRef:
        name: ext-proc-grpc
        port: 4444
---
# Gateway-level ExtProc policy - applies to all routes by default
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: gateway-extproc
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: test-gateway
  extProc:
    extensionRef:
      name: ext-proc-extension
---
# HTTPRoute-level policy with disable field
# This sets extensionRef to nil internally, which should trigger the skip logic
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: httproute-disable-extproc
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: route-with-disable
  extProc:
    disable: {}  # This makes extensionRef nil, triggering the skip logic in processExtProcPolicy