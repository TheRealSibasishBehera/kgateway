apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-with-disable
  namespace: default
spec:
  parentRefs:
    - name: test-gateway
  hostnames:
    - "disabled.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /disabled
      backendRefs:
        - name: backend
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-without-disable
  namespace: default
spec:
  parentRefs:
    - name: test-gateway
  hostnames:
    - "enabled.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /enabled
      backendRefs:
        - name: backend
          port: 3000