# Test route with explicit ExtProc enabled
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-with-explicit-extproc
  namespace: default
spec:
  parentRefs:
    - name: test-gateway
  hostnames:
    - "explicit.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test
      backendRefs:
        - name: backend
          port: 3000
---
# HTTPRoute-level policy with explicit extensionRef
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: httproute-explicit-extproc
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: route-with-explicit-extproc
  extProc:
    extensionRef:
      name: ext-proc-extension